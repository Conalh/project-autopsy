name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high-severity production and development dependencies
        run: npm audit --audit-level=high

      - name: Check release contract
        run: npm run release:check

      - name: Build packages
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run coverage

      - name: Check coverage badge
        run: npm run coverage:badge:check

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: error

      - name: Check sample report drift
        run: npm run samples:check

      - name: Check package surface
        run: npm run package:check
